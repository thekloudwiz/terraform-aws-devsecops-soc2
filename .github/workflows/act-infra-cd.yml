name: Act - Terraform Deployment Pipeline

on:
  pull_request:
    types: [closed]
    branches: [ dev, staging, main ]
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.tfvars'
      - 'infra/modules/**'
      - 'infra/policies/**'
      - '.github/workflows/infra-cd.yml'
      - '!app/**'
      - '!src/**'
      - '!tests/**'
      - '!public/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    # Only run if it's a manual trigger or if the PR was merged (not just closed)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    
    env:
      ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.base_ref || 'dev' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      run: |
        echo "Using AWS credentials from environment variables"
        echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
        echo "AWS credentials configured"

    # - name: Setup Terraform
    #   run: |
    #     # Download and install Terraform directly
    #     curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o terraform.zip
    #     unzip -o terraform.zip
    #     sudo mv terraform /usr/local/bin/
    #     sudo chmod +x /usr/local/bin/terraform
    #     terraform --version

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Fix Permissions
      run: |
        # Fix permissions for the entire infra directory
        sudo chmod -R 755 .
        # Fix OPA binary permissions if it exists
        if [ -f "/usr/local/bin/opa" ]; then
          sudo chmod +x /usr/local/bin/opa
        fi

    - name: Terraform Init
      run: terraform init || echo "Terraform init failed but continuing"

    - name: Select Workspace
      run: terraform workspace select -or-create $ENVIRONMENT || echo "Workspace selection failed but continuing"

    - name: Terraform Plan
      run: |
        echo "Running terraform plan for environment: $ENVIRONMENT"
        terraform plan \
          -var-file="environments/$ENVIRONMENT.tfvars" \
          -out=tfplan || echo "Terraform plan failed but continuing"
        echo "Plan created"

    - name: Upload Terraform Plan
      run: echo "Skipping artifact upload in Act environment"

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.base_ref || 'dev' }}
    defaults:
      run:
        working-directory: ./infra
    env:
      ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.base_ref || 'dev' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      run: |
        echo "Using AWS credentials from environment variables"
        echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
        echo "AWS credentials configured"

    # - name: Setup Terraform
    #   run: |
    #     # Download and install Terraform directly
    #     curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o terraform.zip
    #     unzip -o terraform.zip
    #     sudo mv terraform /usr/local/bin/
    #     sudo chmod +x /usr/local/bin/terraform
    #     terraform --version

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Fix Permissions
      run: |
        # Fix permissions for the entire infra directory
        sudo chmod -R 755 .
        # Fix OPA binary permissions if it exists
        if [ -f "/usr/local/bin/opa" ]; then
          sudo chmod +x /usr/local/bin/opa
        fi

    - name: Terraform Init
      run: terraform init || echo "Terraform init failed but continuing"

    - name: Select Workspace
      run: terraform workspace select -or-create $ENVIRONMENT || echo "Workspace selection failed but continuing"

    - name: Download Terraform Plan
      run: |
        echo "Mock plan" > tfplan
        echo "Plan downloaded"

    - name: Terraform Apply
      run: |
        echo "Would apply terraform plan for environment: $ENVIRONMENT"
        echo "✅ Apply would be successful"

    - name: Notify Slack
      run: |
        echo "Skipping Slack notification in Act environment"
        echo "Would send notification for deployment to $ENVIRONMENT environment"