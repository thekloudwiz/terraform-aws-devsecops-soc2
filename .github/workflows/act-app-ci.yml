name: Act - Application CI Pipeline

on:
  pull_request:
    branches: [ dev, staging, main ]
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - '.github/workflows/app-ci.yml'
      - 'package*.json'
      - 'sonar-project.properties'
      - 'Dockerfile'
      - '.dockerignore'
      - '!.github/dependabot.yml'
      - '!infra/**'
      - '!docs/**'
      - '!scripts/**'
      - '!.githooks/**'

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  security-checks:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref || 'dev' }}
    defaults:
      run:
        working-directory: app
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests with Coverage
        run: npm run test:coverage || echo "Tests failed but continuing"
        
      # SonarCloud is skipped in Act as it requires specific GitHub tokens
      - name: Skip SonarCloud in Act
        run: echo "Skipping SonarCloud in Act environment"
        
      # Snyk is skipped in Act as it requires specific tokens
      - name: Skip Snyk in Act
        run: |
          echo "Skipping Snyk in Act environment"
          mkdir -p reports
          echo '{"vulnerabilities":[],"ok":true}' > reports/snyk-report.json

      - name: Run Integration Tests
        run: npm run test:integration || echo "Integration tests failed but continuing"

      - name: Configure AWS Credentials
        run: |
          # Using environment variables from act-secrets.env
          echo "Using AWS credentials from environment variables"
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS credentials configured"

      - name: Upload Security Reports
        run: |
          echo "Skipping artifact upload in Act environment"
          
      - name: Upload Reports to S3
        run: |
          echo "Skipping S3 upload in Act environment"

  build-and-test-image:
    needs: security-checks
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref || 'dev' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        run: |
          echo "Using AWS credentials from environment variables"
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS credentials configured"

      - name: Mock ECR Login
        id: login-ecr
        run: |
          echo "Mocking ECR login for Act environment"
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Generate Image Tags
        id: tags
        run: |
          PR_NUMBER="123"
          GIT_SHA=$(git rev-parse --short HEAD)
          tag="pr-${PR_NUMBER}-${GIT_SHA}"
          
          # Set outputs
          echo "image_tag=$tag" >> $GITHUB_OUTPUT
          echo "tags=${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:${tag}" >> $GITHUB_OUTPUT
          
          echo "Would store tag in SSM: $tag"
          echo "${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:${tag}" > image-tag.txt

      - name: Upload Image Tag
        run: echo "Image tag saved to image-tag.txt"

      - name: Build Image 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          no-cache: true

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.tags }}
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'  # Don't fail on vulnerabilities in Act
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results
        run: echo "Skipping artifact upload in Act environment"

      - name: Upload Trivy Results to S3
        run: echo "Skipping S3 upload in Act environment"

      - name: Push Image to ECR
        run: echo "Skipping ECR push in Act environment"

      - name: Notify Slack
        run: |
          echo "Skipping Slack notification in Act environment"
          echo "Would send notification for PR #123"
          echo "Image: ${{ steps.tags.outputs.tags }}"