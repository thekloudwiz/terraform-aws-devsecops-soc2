name: Act Test Workflow

on:
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run a simple command
        run: echo "Hello from Act!"
      
      - name: Create a file
        run: echo "Test content" > test-file.txt
      
      # Skip artifact upload when running in Act
      - name: Check if running in Act
        id: check-act
        run: |
          if [ -n "$ACT" ]; then
            echo "Running in Act environment"
            echo "is_act=true" >> $GITHUB_OUTPUT
          else
            echo "Running in GitHub Actions"
            echo "is_act=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload artifact
        if: steps.check-act.outputs.is_act != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: test-file.txt
          
      - name: Mock artifact upload for Act
        if: steps.check-act.outputs.is_act == 'true'
        run: echo "Artifact would be uploaded in GitHub Actions"