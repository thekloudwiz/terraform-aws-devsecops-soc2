name: Act Test Workflow

on:
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run a simple command
        run: echo "Hello from Act!"
      
      - name: Create a file
        run: echo "Test content" > test-file.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: test-file.txt