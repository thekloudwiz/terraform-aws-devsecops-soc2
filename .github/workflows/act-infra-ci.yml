name: Act - Terraform Validation Pipeline

on:
  pull_request:
    branches: [ dev, staging, main ]
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.tfvars'
      - 'infra/modules/**'
      - 'infra/policies/**'
      - '.github/workflows/infra-ci.yml'
      - '!.github/dependabot.yml'
      - '!app/**'
      - '!src/**'
      - '!tests/**'
      - '!public/**'

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: infra/

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.base_ref || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        run: |
          # Download and install Terraform directly
          curl -fsSL https://releases.hashicorp.com/terraform/1.12.1/terraform_1.12.1_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/
          sudo chmod +x /usr/local/bin/terraform
          terraform --version

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix Permissions
        run: |
          # Fix permissions for the entire infra directory
          sudo chmod -R 755 .
          # Fix OPA binary permissions if it exists
          if [ -f "/usr/local/bin/opa" ]; then
            sudo chmod +x /usr/local/bin/opa
          fi

      - name: Install Tools
        run: |
          echo "Installing checkov and OPA"
          pip install checkov || echo "Failed to install checkov but continuing"
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64 && chmod 755 ./opa && sudo mv opa /usr/local/bin/ || echo "Failed to install OPA but continuing"
          sudo chmod +x /usr/local/bin/opa

      - name: Configure AWS Credentials
        run: |
          echo "Using AWS credentials from environment variables"
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          # echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS credentials configured"

      - name: Terraform Init
        run: terraform init || echo "Terraform init failed but continuing"

      - name: Select Workspace
        run: terraform workspace select -or-create $WORKSPACE || echo "Workspace selection failed but continuing"

      - name: Terraform Format
        run: terraform fmt -check -recursive || echo "Terraform format check failed but continuing"

      - name: Terraform Validate
        run: terraform validate || echo "Terraform validation failed but continuing"

      - name: Run Checkov Tests
        run: checkov -d . --quiet || echo "Checkov tests failed but continuing"

      - name: Run OPA Checks
        run: |
          # Debug information
          echo "Current directory: $(pwd)"
          echo "Listing files in current directory:"
          ls -la
          echo "Checking if Makefile exists:"
          if [ -f "Makefile" ]; then
            echo "Makefile exists"
            cat Makefile
          else
            echo "Makefile does not exist"
          fi
          
          # Try to run make test-opa
          make test-opa || echo "OPA checks failed but continuing"

      - name: Run Terraform Test
        run: |
          # Debug information
          echo "Current directory: $(pwd)"
          echo "Listing environments directory:"
          ls -la environments/ || echo "Cannot list environments directory"
          
          # Check if tfvars file exists
          if [ -f "environments/$WORKSPACE.tfvars" ]; then
            echo "Found tfvars file: environments/$WORKSPACE.tfvars"
            terraform test -var-file="environments/$WORKSPACE.tfvars" || echo "Terraform tests failed but continuing"
          else
            echo "No tfvars file found for workspace $WORKSPACE"
            echo "Available files in environments directory:"
            ls -la environments/
            echo "Skipping terraform test"
          fi

      - name: Notify Slack
        run: |
          echo "Skipping Slack notification in Act environment"
          echo "Would send notification for validation of $WORKSPACE environment"